name: Publish extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Test, publish, and create release
    runs-on: ubuntu-latest
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies --out "midi-realplayer-${PACKAGE_VERSION}.vsix"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "midi-realplayer-${PACKAGE_VERSION}.vsix" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "midi-realplayer-${PACKAGE_VERSION}.vsix" \
              --verify-tag \
              --generate-notes \
              --title "MIDI RealPlayer ${PACKAGE_VERSION}"
          fi

      - name: Check Marketplace version
        id: marketplace
        shell: bash
        run: |
          MARKETPLACE_VERSION="$(
            npx vsce show vaclis.midi-realplayer --json |
              node -e "
                let input = '';
                process.stdin.on('data', chunk => input += chunk);
                process.stdin.on('end', () => {
                  const extension = JSON.parse(input);
                  process.stdout.write(extension.versions?.[0]?.version ?? '');
                });
              "
          )"
          if [[ "${MARKETPLACE_VERSION}" == "${PACKAGE_VERSION}" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Marketplace ${PACKAGE_VERSION} already exists; skipping publish."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to VS Code Marketplace
        if: steps.marketplace.outputs.publish == 'true' && env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies

      - name: Report missing Marketplace credential
        if: steps.marketplace.outputs.publish == 'true' && env.HAS_VSCE_PAT != 'true'
        shell: bash
        run: |
          echo "::warning::VSCE_PAT is not configured; GitHub Release was created, but Marketplace publishing was skipped."
